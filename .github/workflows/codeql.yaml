name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '24 2 * * 1'

jobs:
  analyze:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce
    with:
      repository-name: lirem/jellyfin-plugin-progress-sync
