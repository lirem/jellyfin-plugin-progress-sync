<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="1" stop-color="#0b2a3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <!-- sync ring: two arcs with arrow heads -->
  <g fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round">
    <path d="M 353 214 A 135 135 0 0 1 597 192" marker-end="url(#head)"/>
    <path d="M 607 306 A 135 135 0 0 1 363 327" marker-end="url(#head)"/>
  </g>
  <!-- two play triangles: one per user, offset -->
  <path d="M 425 205 L 425 315 L 510 260 Z" fill="#ffffff" opacity="0.35"/>
  <path d="M 450 205 L 450 315 L 535 260 Z" fill="#ffffff"/>
  <!-- progress bar -->
  <rect x="330" y="438" width="300" height="12" rx="6" fill="#ffffff" opacity="0.18"/>
  <rect x="330" y="438" width="190" height="12" rx="6" fill="url(#accent)"/>
  <text x="480" y="505" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">Progress Sync</text>
</svg>
